<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07182d"><title>MAXXWEB Admin Desk</title><style>
:root{--n:#07182d;--c:#f3f0e7;--l:#d5f36a;--muted:#a7b3c3}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--c);font:15px Arial,sans-serif}header{border-bottom:1px solid #ffffff20;padding:18px 0}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.brand{font-weight:900;font-size:23px;letter-spacing:-1px}.brand span{color:var(--l)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.btn{border:0;border-radius:22px;padding:11px 16px;background:var(--l);color:var(--n);font-weight:bold;cursor:pointer}.btn.alt{background:transparent;color:var(--c);border:1px solid #ffffff30}.hero{padding:45px 0 25px}.eyebrow{color:var(--l);font-size:11px;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(35px,5vw,58px);letter-spacing:-3px;margin:12px 0}.hero p{color:var(--muted);line-height:1.7}.message{color:var(--l);min-height:20px;font-size:13px}.list{display:grid;gap:15px;margin:20px 0 60px}.item{border:1px solid #ffffff20;background:#0d2139;border-radius:17px;padding:22px}.item-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.item h2{margin:0 0 6px;font-size:21px}.muted{color:var(--muted);font-size:12px}.tag{border:1px solid #d5f36a50;color:var(--l);padding:6px 10px;border-radius:20px;font-size:11px;height:max-content}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.detail{background:#07182d;border-radius:10px;padding:14px}.detail label{display:block;color:var(--l);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}.detail p{white-space:pre-wrap;line-height:1.6;margin:0;font-size:13px}.transcript{margin-top:12px;border-top:1px solid #ffffff18;padding-top:12px;max-height:180px;overflow:auto}.transcript p{font-size:12px;line-height:1.6;color:#cad5e1}.billing{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:15px}.billing label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.billing input{width:180px;max-width:100%;padding:11px;background:#07182d;border:1px solid #ffffff24;color:white;border-radius:9px}.no-data{border:1px dashed #ffffff30;border-radius:16px;padding:28px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{padding:15px}}
</style></head><body><header><div class="wrap top"><a class="brand" href="/">MAXX<span>WEB</span> · ADMIN</a><button class="btn alt" id="logout">Sign out</button></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Private workspace</div><h1>Client requests &<br>final billing.</h1><p>Review AI-assisted conversation summaries, budget requests, negotiated proposals, and approve the final bill.</p><div id="status" class="message">Checking admin access…</div></section><section id="records" class="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://uedinxjacwlecumexdmq.supabase.co",SB_KEY="sb_publishable_QgpsjDbn6Ql_PoeJVfBC5Q_8j4hHG1z";const sb=window.supabase.createClient(SB_URL,SB_KEY);const statusEl=document.getElementById("status"),records=document.getElementById("records");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){return v==null?"Not set":"₹"+Number(v).toLocaleString("en-IN");}
async function load(){statusEl.textContent="Validating admin permissions…";const {data:{user},error:authError}=await sb.auth.getUser();if(authError||!user){location.href="/?admin=login";return;}const {data:admin,error:adminErr}=await sb.from("maxxweb_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(adminErr||!admin){await sb.auth.signOut();statusEl.textContent="This account is not authorized.";return;}statusEl.textContent="Admin verified · "+esc(user.email);const {data,error}=await sb.from("maxxweb_client_interactions").select("*").order("created_at",{ascending:false});if(error){statusEl.textContent="Could not load client submissions. Check database permissions.";return;}records.innerHTML="";if(!data.length){records.innerHTML='<div class="no-data">No client requests yet. New submitted project chats will appear here.</div>';return;}data.forEach(row=>{const transcript=Array.isArray(row.conversation)?row.conversation.map(m=>'<p><b>'+esc(m.role==="user"?"Client":"Assistant")+'</b>: '+esc(m.content)+'</p>').join(""):"";const card=document.createElement("article");card.className="item";card.innerHTML='<div class="item-head"><div><h2>'+esc(row.client_name)+' · '+esc(row.project_type||"Website project")+'</h2><div class="muted">'+esc(row.client_email)+' · '+esc(row.client_phone||"No phone")+' · '+new Date(row.created_at).toLocaleString()+'</div></div><span class="tag">'+esc(row.bill_status)+'</span></div><div class="grid"><div class="detail"><label>AI / project summary</label><p>'+esc(row.ai_summary||"Summary pending")+'</p></div><div class="detail"><label>Project brief & client budget</label><p>'+esc(row.project_brief||"—")+'\nBudget: '+money(row.client_budget)+'</p></div><div class="detail"><label>Negotiated proposal</label><p>'+money(row.negotiated_amount)+'</p></div><div class="detail"><label>Final bill</label><p>'+money(row.final_bill)+'</p></div></div><div class="transcript"><label class="muted">Conversation record</label>'+transcript+'</div><div class="billing"><div><label for="bill-'+row.id+'">Set final bill (₹)</label><input type="number" min="0" id="bill-'+row.id+'" value="'+(row.final_bill??row.negotiated_amount??"")+'" placeholder="Enter approved amount"></div><button class="btn" data-approve="'+row.id+'">Approve final bill</button><button class="btn alt" data-pending="'+row.id+'">Keep pending</button></div>';records.appendChild(card);});}
records.addEventListener("click",async e=>{const id=e.target.dataset.approve||e.target.dataset.pending;if(!id)return;const approve=Boolean(e.target.dataset.approve);const field=document.getElementById("bill-"+id);const val=field.value.trim();if(approve&&(!val||!Number.isFinite(Number(val))||Number(val)<0)){statusEl.textContent="Enter a valid final bill amount.";return;}const updates=approve?{final_bill:Number(val),bill_status:"approved"}:{bill_status:"pending_admin_approval"};const {error}=await sb.from("maxxweb_client_interactions").update(updates).eq("id",id);if(error){statusEl.textContent="Update failed. Confirm you have admin access.";return;}statusEl.textContent=approve?"Final bill approved and saved.":"Request set to pending.";await load();});
document.getElementById("logout").addEventListener("click",async()=>{await sb.auth.signOut();location.href="/";});load();
</script></body></html>
